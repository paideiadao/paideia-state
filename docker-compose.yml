version: '3'

services:

  paideia-state:
    container_name: paideia-state-main
    # Published by .github/workflows/docker.yml; `docker compose pull` fetches it.
    # `docker compose build` still builds locally (needs ../paideia-sdk checked out).
    image: ghcr.io/paideiadao/paideia-state:latest
    build:
      context: ..
      dockerfile: paideia-state/Dockerfile
    env_file: .env
    volumes:
      - ./transaction_archive:/opt/docker/transaction_archive
      - ./errors:/opt/docker/errors
      - ./stakingStates:/opt/docker/stakingStates
      - ./daoconfigs:/opt/docker/daoconfigs
      - ./proposals:/opt/docker/proposals
      - ./state:/opt/docker/state
    ports:
      - 9124:9000
    networks:
      - p-net
    restart: unless-stopped

networks:
  p-net:
    external: true
