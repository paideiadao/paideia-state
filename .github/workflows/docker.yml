name: Docker image

# Builds paideia-state together with paideia-sdk (checked out side by side, as the
# Dockerfile expects) and pushes the image to GHCR.
#
#   ghcr.io/paideiadao/paideia-state:latest      -> every push to main
#   ghcr.io/paideiadao/paideia-state:<tag>       -> pushed git tags (v*)
#   ghcr.io/paideiadao/paideia-state:sha-<short> -> every build
#
# The paideia-sdk revision is pinned in SDK_REF below; bump it deliberately when the
# SDK changes. A manual run ("Run workflow") can override it for testing.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      sdk_ref:
        description: "paideia-sdk git ref to build against (default: SDK_REF in the workflow)"
        required: false
        default: ""
      push:
        description: "Push the image to GHCR"
        type: boolean
        default: true

env:
  IMAGE: ghcr.io/paideiadao/paideia-state
  SDK_REF: 42cdd964fa415026cbf2176f326a6dffd628821b

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout paideia-state
        uses: actions/checkout@v4
        with:
          path: paideia-state

      - name: Checkout paideia-sdk
        uses: actions/checkout@v4
        with:
          repository: paideiadao/paideia-sdk
          ref: ${{ inputs.sdk_ref || env.SDK_REF }}
          path: paideia-sdk

      - name: Keep the build context small
        run: cp paideia-state/.dockerignore.workspace .dockerignore

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.description=Paideia DAO state service (paideia-sdk ${{ inputs.sdk_ref || env.SDK_REF }})

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: paideia-state/Dockerfile
          push: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.push) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
