# https://www.playframework.com/documentation/latest/Configuration

# Genesis values of the protocol instance this service tracks.
# Immutable per deployment — see the warning inside the file. To track a
# different instance (testnet / fresh bootstrap), swap this include for your
# own genesis file.
include "genesis/paideia-mainnet.conf"

# =============================================================================
# Operator-local settings — safe to change per deployment/party.
# Multiple independently operated instances of this service are expected to
# differ ONLY in the values below (plus the play.* settings at the bottom).
# =============================================================================
paideia {
    # Ergo node (must have the ZMQ plugin enabled) and explorer API
    node = "http://192.168.1.137:9053"
    node = ${?ERGO_NODE}
    explorer = "https://api.ergoplatform.com"
    explorer = ${?ERGO_EXPLORER}
    zmqHost = ${?ZMQ_HOST}
    zmqPort = ${?ZMQ_PORT}

    # Address receiving operator bot fees for transactions this instance submits
    operatorAddress = "9h7L7sUHZk43VQC3PHtSp5ujAWcZtYmWATBH746wi75C5XHi68b"
    operatorAddress = ${?OPERATOR_ADDRESS}

    # Off-chain bot behavior
    compoundBatchSize = 1000
    defaultBotFee = 1000

    # UI fees charged by this operator's frontend (not part of the protocol)
    uiFeeAddress = ${?UI_FEE_ADDRESS}
    uiFeeCreateDAO = 5000000000
    uiFeeCreateProposal = 200000000
    uiFeeCastVote = 50000000
    uiFeeStakeOp = 50000000
}

play.modules.enabled += "modules.PaideiaStateModule"
play.modules.enabled += "modules.PaideiaSyncModule"
play.modules.enabled += "modules.PaideiaArchiveModule"
play.modules.enabled += "modules.ErrorLoggingModule"

akka {
  loggers = ["akka.event.slf4j.Slf4jLogger"]
  loglevel = "DEBUG"
  logging-filter = "akka.event.slf4j.Slf4jLoggingFilter"
}

play.filters.hosts {
  allowed = ["."]
}

play.http.secret.key = "changeme"
play.http.secret.key = ${?APPLICATION_SECRET}

play.server.pidfile.path=/dev/null
