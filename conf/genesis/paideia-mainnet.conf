# =============================================================================
# GENESIS VALUES — Paideia protocol instance on Ergo MAINNET
# =============================================================================
# These values identify the on-chain genesis artifacts of this protocol
# instance and seed the initial Paideia DAO config AVL tree on startup
# (PaideiaStateActor.initiate). Sync then replays every on-chain config
# update on top of that seed.
#
# DO NOT EDIT for an existing deployment — not even when on-chain governance
# has since changed a value. The seed must reproduce the genesis tree digest
# byte-for-byte; editing a value makes this instance silently fork from the
# chain. (Example: im_paideia_fees_emit_paideia is 20000 here but 10000
# on-chain today after governance updates — that is correct.)
#
# To run against a DIFFERENT protocol instance (testnet, or a fresh mainnet
# deployment created via POST /dao/bootstrap): copy this file, fill in the
# values produced by your own bootstrap transaction, and change the include
# in application.conf (or point -Dconfig.file at a full alternative config).
# =============================================================================

paideia {
    networkType = "mainnet"

    # --- On-chain genesis artifacts (identity of this protocol instance) ---
    paideiaDaoKey = "1b4b8b789fdd4a34c5f1cf73b4d99a5cacb8ccba75265f6edf4950893b162f07"
    paideiaOriginNFT = "18b3490e56396577d51c24a1927e635a46887b05826f4e00b130f8193fbdc82a"
    daoTokenId = "171c56d1aa54a6709bdadcc0f053e7a786411224a8f40111a6878549a3fae842"
    paideiaTokenId = "1fd6e032e8476c4aa54c18c1a308dce83940e8f4a28f576440513ed7326ad489"
    im_paideia_dao_action_tokenid = "000653ab0e7fb89bfa221d75bd25aed8b98e0bac66a13aa229caf5855128d33a"
    im_paideia_dao_proposal_tokenid = "0b2061b664725d7570fdfc40de19b554e60952ced7649f4ad4a9ee2c8640f7c3"
    im_paideia_staking_state_tokenid = "233536261ad8920b85644d30fff8e68c470470138950317ad520b300e8c1e573"

    # --- Sync anchor points ---
    # Block height just before the bootstrap transactions landed on-chain.
    syncStart = 1380365
    # Timestamp (ms) of the first staking emission for the Paideia DAO.
    emission_start = 1729771200000

    # --- Genesis DAO config tree seed values ---
    # Current values live in the on-chain config AVL tree and may differ;
    # query GET /dao/<paideiaDaoKey>/config for those.
    im_paideia_dao_name = "Paideia"
    im_paideia_dao_quorum = 150
    im_paideia_dao_threshold = 600
    im_paideia_dao_min_proposal_time = 86400000
    im_paideia_fees_createdao_erg = 100000000
    im_paideia_fees_createdao_paideia = 1000000000
    im_paideia_fees_createproposal_paideia = 10000000
    im_paideia_fees_compound_operator_paideia = 100
    im_paideia_fees_emit_paideia = 20000
    im_paideia_fees_emit_operator_paideia = 100
    im_paideia_fees_operator_max_erg = 5000000
    im_paideia_staking_weight_participation = 10
    im_paideia_staking_weight_pureparticipation = 10
    im_paideia_staking_cyclelength = 432000000
    im_paideia_staking_emission_amount = 273970000
    im_paideia_staking_emission_delay = 1
    im_paideia_staking_profit_share_pct = 0
}
